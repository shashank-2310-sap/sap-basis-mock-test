<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAP Basis Mock Test - mock exam and practice platform" />
    <title>SAP Basis Mock Test</title>
    <script>
      // Apply the saved theme before paint to avoid a light-mode flash. Default dark.
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark'
          var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (t === 'dark' || (t === 'system' && sysDark)) document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
